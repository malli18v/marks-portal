services:
  backend:
    build:
      context: ./backend
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-key-change-this-development-secret-key}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://127.0.0.1:5173}
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"